{{ define "main" }}
<div class="site-layout">{{ partial "blog-sidebar.html" . }}<main id="main-content" class="main-column"><h1 class="page-title">{{ .Title }}</h1><p class="muted">共 {{ len .Data.Terms }} 个{{ .Title }}</p><ul class="term-list">{{ range .Data.Terms.Alphabetical }}<li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a><span>{{ .Count }}</span></li>{{ end }}</ul></main></div>
{{ end }}
