<article class="post-entry"><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ range .GetTerms "categories" }}<span class="meta-divider">|</span><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</p><p class="post-summary">{{ .Description | default (.Summary | plainify) }}</p></article>
