baseURL = 'https://yzd05.github.io/'
title = "yzd 的博客"
locale = 'zh-CN'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
theme = 'PaperMod'
enableRobotsTXT = true
timeZone = 'Asia/Shanghai'
summaryLength = 100
[taxonomies]
tag = 'tags'
category = 'categories'

[pagination]
pagerSize = 10

[outputs]
home = ['HTML', 'RSS', 'JSON']

[params]
author = 'yzd'
description = 'yzd 的个人笔记本。记录论文阅读、技术探索，以及从理解到实践的过程。'
keywords = ['论文阅读', '技术笔记', '机器学习', '计算机科学']
mainSections = ['posts']
defaultTheme = 'light'
disableThemeToggle = true
ShowReadingTime = true
ShowWordCount = false
hideAuthor = true
ShowToc = true
TocOpen = false
UseHugoToc = true
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowRssButtonInSectionTermList = false
disableSpecial1stPost = true
hideSummary = false
DateFormat = '2006.01.02'
disableScrollToTop = true

[params.label]
text = "yzd's notebook"

[params.assets]
favicon = '/favicon.svg'
theme_color = '#ffffff'
msapplication_TileColor = '#ffffff'
disableHLJS = true

[[menu.main]]
name = '首页'
url = '/'
weight = 10

[[menu.main]]
name = '归档'
url = '/archives/'
weight = 20

[[menu.main]]
name = '标签'
url = '/tags/'
weight = 30

[[menu.main]]
name = '分类'
url = '/categories/'
weight = 40

[[menu.main]]
name = '关于'
url = '/about/'
weight = 50


[markup.highlight]
noClasses = false
lineNos = false
codeFences = true

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false
